# Nginx reverse proxy para ÁGORA en producción.
# Se monta dentro del contenedor agora_nginx_prod en /etc/nginx/conf.d/default.conf

# Redirige HTTP a HTTPS
server {
    listen 80;
    server_name agora.aspaniasburgos.com;

    # ACME-challenge para Let's Encrypt (si se usa)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl http2;
    server_name agora.aspaniasburgos.com;

    # Certificados — montados desde el host
    ssl_certificate     /etc/nginx/ssl/agora.crt;
    ssl_certificate_key /etc/nginx/ssl/agora.key;

    # Configuración SSL endurecida
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — un año, incluye subdominios
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25M;  # documentos sanitarios PDF / cert. discapacidad

    # Archivos estáticos servidos directamente por Nginx
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Archivos de medios (documentos sanitarios) — acceso solo autenticado
    location /media/ {
        internal;  # Solo accesible vía X-Accel-Redirect desde Django
        alias /app/media/;
    }

    # App Django via Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # HTMX puede tardar un poco en algunos endpoints
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Bloquea el acceso a archivos sensibles
    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }
}

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "migrations",
    "__pycache__",
    "models_legacy.py.bak",
]

[tool.ruff.lint]
# Conjunto razonable para Django: errores reales + pyflakes + isort.
# Evitar reglas extremas (B, ANN, D) para no inflar la deuda heredada.
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line too long — gestionado por black/manual
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["F401", "E501", "I001"]
"**/settings/*" = ["F405", "F403"]
"**/__init__.py" = ["F401"]  # re-exports legítimos

[tool.ruff.lint.isort]
known-first-party = ["agora", "core", "personas", "pia", "agenda", "intervenciones", "indicadores"]

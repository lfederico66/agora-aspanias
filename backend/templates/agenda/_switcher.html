{# Switcher común Hoy / Semana / Mes. Marca activa la vista actual. #}
<div class="flex items-center gap-2 flex-wrap">
    <div class="inline-flex rounded-lg border border-slate-200 bg-white p-1 shadow-sm">
        <a href="{% url 'agenda:hoy' %}" class="rounded-md px-3 py-1 text-sm {% if vista_activa == 'hoy' %}bg-emerald-700 text-white font-medium{% else %}text-slate-600 hover:bg-slate-100{% endif %}">Hoy</a>
        <a href="{% url 'agenda:semana' %}" class="rounded-md px-3 py-1 text-sm {% if vista_activa == 'semana' %}bg-emerald-700 text-white font-medium{% else %}text-slate-600 hover:bg-slate-100{% endif %}">Semana</a>
        <a href="{% url 'agenda:mes' %}" class="rounded-md px-3 py-1 text-sm {% if vista_activa == 'mes' %}bg-emerald-700 text-white font-medium{% else %}text-slate-600 hover:bg-slate-100{% endif %}">Mes</a>
    </div>
    <span class="mx-1 text-slate-300">|</span>
    {% if anterior %}<a href="?fecha={{ anterior }}" class="rounded border border-slate-300 bg-white px-3 py-1.5 text-sm hover:border-emerald-400">←</a>{% endif %}
    <a href="?fecha={{ hoy_iso }}" class="rounded border border-emerald-300 bg-emerald-50 px-3 py-1.5 text-sm text-emerald-800 font-medium">Hoy</a>
    {% if siguiente %}<a href="?fecha={{ siguiente }}" class="rounded border border-slate-300 bg-white px-3 py-1.5 text-sm hover:border-emerald-400">→</a>{% endif %}
    <a href="{% url 'agenda:crear' %}" class="ml-1 rounded bg-emerald-700 text-white px-4 py-1.5 text-sm font-medium hover:bg-emerald-800">+ Nueva cita</a>
</div>

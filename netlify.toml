# Netlify — deploy automático de la demo ÁGORA
# El HTML del repo ya lleva el sidebar inyectado (build_demo.py se ejecuta en local);
# aquí solo se genera el CSS purgado, que está excluido del repo (.gitignore).

[build]
  publish = "demo"
  command = "npm ci && npm run build:css"

[build.environment]
  NODE_VERSION = "20"

# Evitar caché agresiva del HTML — cada deploy se ve al instante
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_partials/*"
  [headers.values]
    X-Robots-Tag = "noindex"
